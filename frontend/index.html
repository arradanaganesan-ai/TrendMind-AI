<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TrendMind AI — Search the web. Discover patterns. Understand what matters. AI-powered web research and trend intelligence."
    />
    <title>TrendMind AI — The Web Intelligence Engine</title>
    <!-- Fonts are self-hosted (public/fonts + @font-face in styles/index.css):
         no external font requests, so no proxy/console failures. -->
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Mirrors ThemeProvider (src/components/ui/ThemeProvider.tsx).
      (function () {
        try {
          var pref = localStorage.getItem('trendmind.theme.v1');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              (!window.matchMedia ||
                !window.matchMedia('(prefers-color-scheme: light)').matches));
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
